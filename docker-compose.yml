services:
  campus:
    build: .
    container_name: rfid-campus-demo
    ports:
      # 宿主机端口默认 9000 而不是 8000：Windows 的「排除端口段」包含 7989-8088，
      # Docker 绑定 0.0.0.0:8000 会被系统拒绝（报 "access permissions" 错误）。
      # 用 netsh interface ipv4 show excludedportrange protocol=tcp 可以查看本机的保留段。
      # 容器内部仍然是 8000，不受影响。
      - "${HOST_PORT:-9600}:8000"
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      RDR_HOST: "192.168.0.30"
      RDR_PORT: "8160"
      RDR_ANTENNA: "1"
      RDR_POWER: "30"
      RDR_REPEATED_TIME: "50"
      DEDUP_WINDOW: "10"
      DUPLICATE_WINDOW: "120"
      USE_DEVICE_BEEP: "0"
      # simulate.py 拼默认请求地址用。容器内 uvicorn 监听的是 8000，
      # 不是宿主机映射的 9600 —— 在容器里跑 simulate.py 时用这个值才对。
      HTTP_PORT: "8000"
    restart: unless-stopped
